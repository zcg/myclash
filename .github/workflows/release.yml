name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-myclash
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' mygo.json)"
          tag="v${version}"
          release="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match mygo.json version ${version}"
              exit 1
            fi
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "release ${tag} already exists; nothing to do"
            else
              release="true"
            fi
          else
            old=""
            if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
              old="$(git show "${BEFORE_SHA}:mygo.json" 2>/dev/null | jq -r '.version // empty')"
            fi
            if [[ "${old}" != "${version}" ]]; then
              if gh release view "${tag}" >/dev/null 2>&1; then
                echo "release ${tag} already exists; nothing to do"
              else
                release="true"
              fi
            fi
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} tag=${tag} release=${release}"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            platforms: windows/amd64,windows/arm64
          - os: macos-latest
            artifact: macos
            platforms: darwin/universal
          - os: ubuntu-latest
            artifact: linux
            platforms: linux/amd64,linux/arm64
    runs-on: ${{ matrix.os }}
    env:
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install mygo (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go install github.com/egoist/mygo/cmd/mygo@v0.9.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install mygo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/egoist/mygo/cmd/mygo@v0.9.1
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build packages
        shell: bash
        run: |
          mygo build -platform "${{ matrix.platforms }}" -skip-notarize -o dist

      - name: Make release asset names unique
        shell: bash
        run: |
          if [ -f dist/SHA256SUMS ]; then
            mv dist/SHA256SUMS "dist/SHA256SUMS-${{ matrix.artifact }}"
          fi

          for dir in dist/windows-*; do
            [ -d "$dir" ] || continue
            arch="${dir##*-}"
            if [ -f "$dir/myclash.exe" ]; then
              mv "$dir/myclash.exe" "$dir/myclash-windows-$arch.exe"
            fi
            if [ -f "$dir/install.ps1" ]; then
              mv "$dir/install.ps1" "$dir/install-windows-$arch.ps1"
            fi
          done

          for dir in dist/linux-*; do
            [ -d "$dir" ] || continue
            arch="${dir##*-}"
            if [ -f "$dir/PKGBUILD" ]; then
              mv "$dir/PKGBUILD" "$dir/PKGBUILD-linux-$arch"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: myclash-${{ matrix.artifact }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: find release -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: myclash ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.tar.gz
            release/**/*.deb
            release/**/*.rpm
            release/**/*.pkg.tar.zst
            release/**/PKGBUILD*
            release/**/SHA256SUMS-*
            release/**/install*.ps1
